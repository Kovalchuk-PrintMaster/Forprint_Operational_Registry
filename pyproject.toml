[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forprint-operational-registry"
version = "0.1.0"
description = "ForPrint Operational Registry bootstrap module."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.0",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
forprint_operational_registry = ["config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv_operational_registry",
    "reports",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"